name: Help translate
description: Offer to translate the site, or point to an existing translation of the guide.
title: 'Translation: '
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: offer
    attributes:
      label: How can you help?
      description: Translating, reviewing, or pointing to an existing translation (the guide is CC0, so existing translations can be used with credit). See docs/TRANSLATING.md.
    validations:
      required: true
