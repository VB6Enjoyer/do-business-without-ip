name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:text
      - run: npm run build
      - run: npm run check:epub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Ask the Internet Archive to snapshot the new version. Best effort: a
  # failure here never fails the deploy.
  archive:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Save pages to the Wayback Machine
        run: |
          base="https://vb6enjoyer.github.io/do-business-without-ip"
          for path in / /guide/ /creators/ /about/ /downloads/do-business-without-ip.epub /rss.xml; do
            echo "Saving ${base}${path}"
            curl -sS -o /dev/null -w "%{http_code}\n" --max-time 120 "https://web.archive.org/save/${base}${path}" || true
            sleep 15
          done
